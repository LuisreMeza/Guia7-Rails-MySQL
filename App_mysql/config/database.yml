default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: ""
  host: 127.0.0.1
  port: 3306
  timeout: 5000

development:
  <<: *default
  database: RoR

test:
  <<: *default
  database: RoR_test

production:
  <<: *default
  database: RoR_production